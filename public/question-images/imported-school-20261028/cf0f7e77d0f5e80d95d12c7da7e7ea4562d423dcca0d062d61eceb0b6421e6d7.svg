<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Four boxes show 9, 14, 19 and 24; the sequence increases by five.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><rect x="70" y="150" width="110" height="80" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="110" y="200">9</text><rect x="210" y="150" width="110" height="80" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="250" y="200">14</text><rect x="350" y="150" width="110" height="80" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="390" y="200">19</text><rect x="490" y="150" width="110" height="80" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="530" y="200">24</text><text x="100" y="100">A sequence increases by 5</text></g></svg>