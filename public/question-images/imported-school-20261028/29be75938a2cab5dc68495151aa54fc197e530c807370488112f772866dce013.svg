<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Two equal-weight blocks rest on contact areas A equals 20 square cm and B equals 10 square cm.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><rect x="100" y="170" width="200" height="80" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/><rect x="420" y="90" width="100" height="160" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/><line x1="70" y1="250" x2="570" y2="250" stroke="#1e40af" stroke-width="3"/><text x="130" y="300">A: 20 cm²</text><text x="390" y="300">B: 10 cm²</text><text x="170" y="45">Equal weights</text></g></svg>