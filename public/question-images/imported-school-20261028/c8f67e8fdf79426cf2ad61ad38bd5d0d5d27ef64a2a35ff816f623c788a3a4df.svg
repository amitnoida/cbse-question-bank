<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A rectangle has side lengths x plus 3 and x plus 2, partitioned into regions x squared, 3x, 2x and 6.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><rect x="150" y="100" width="350" height="230" fill="none" stroke="#1e40af" stroke-width="2"/><line x1="400" y1="100" x2="400" y2="330" stroke="#1e40af" stroke-width="3"/><line x1="150" y1="250" x2="500" y2="250" stroke="#1e40af" stroke-width="3"/><text x="260" y="80">x</text><text x="445" y="80">3</text><text x="110" y="185">x</text><text x="110" y="300">2</text><text x="220" y="190">x²</text><text x="435" y="190">3x</text><text x="240" y="300">2x</text><text x="440" y="300">6</text></g></svg>