<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Parallel sunlight travels from the left toward Earth. P is on the illuminated left side; Q is on the dark right side.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><circle cx="330" cy="200" r="120" fill="#334155"/><path d="M330 80 A120 120 0 0 0 330 320 Z" fill="#bfdbfe"/><line x1="50" y1="130" x2="190" y2="130" stroke="#1e40af" stroke-width="3"/><text x="190" y="136">→</text><line x1="50" y1="200" x2="190" y2="200" stroke="#1e40af" stroke-width="3"/><text x="190" y="206">→</text><line x1="50" y1="270" x2="190" y2="270" stroke="#1e40af" stroke-width="3"/><text x="190" y="276">→</text><text x="90" y="70">Sunlight</text><text x="255" y="205">P</text><text x="380" y="205" fill="white">Q</text></g></svg>