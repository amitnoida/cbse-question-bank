<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A food label lists protein 8 g, carbohydrate 20 g and fat 3 g per serving.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><rect x="120" y="70" width="400" height="250" fill="#f8fafc" stroke="#1e40af" stroke-width="2"/><text x="180" y="115">Per serving</text><text x="160" y="175">Protein: 8 g</text><text x="160" y="225">Carbohydrate: 20 g</text><text x="160" y="275">Fat: 3 g</text></g></svg>