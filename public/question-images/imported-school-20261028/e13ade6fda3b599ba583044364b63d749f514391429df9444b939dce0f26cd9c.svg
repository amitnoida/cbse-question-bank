<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Historical timeline. 1526: Babur defeats Ibrahim Lodi; 1556: Akbar begins his reign; 1605: Jahangir begins his reign</title><rect width="640" height="400" fill="white"/><g font-family="Noto Sans Devanagari,Arial,sans-serif" font-size="20" fill="#172554"><text x="45" y="45" font-size="24">Historical timeline</text><rect x="40" y="75" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="100">1526: Babur defeats Ibrahim Lodi</text><rect x="40" y="151" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="176">1556: Akbar begins his reign</text><rect x="40" y="227" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="252">1605: Jahangir begins his reign</text></g></svg>