<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Stages zero to three contain one, two, four and eight dots, respectively.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><text x="65" y="70">Stage 0</text><circle cx="90" cy="125" r="9" fill="#2563eb"/><text x="205" y="70">Stage 1</text><circle cx="230" cy="125" r="9" fill="#2563eb"/><circle cx="254" cy="125" r="9" fill="#2563eb"/><text x="345" y="70">Stage 2</text><circle cx="370" cy="125" r="9" fill="#2563eb"/><circle cx="394" cy="125" r="9" fill="#2563eb"/><circle cx="370" cy="170" r="9" fill="#2563eb"/><circle cx="394" cy="170" r="9" fill="#2563eb"/><text x="485" y="70">Stage 3</text><circle cx="510" cy="125" r="9" fill="#2563eb"/><circle cx="534" cy="125" r="9" fill="#2563eb"/><circle cx="510" cy="170" r="9" fill="#2563eb"/><circle cx="534" cy="170" r="9" fill="#2563eb"/><circle cx="510" cy="215" r="9" fill="#2563eb"/><circle cx="534" cy="215" r="9" fill="#2563eb"/><circle cx="510" cy="260" r="9" fill="#2563eb"/><circle cx="534" cy="260" r="9" fill="#2563eb"/></g></svg>