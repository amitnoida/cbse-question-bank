<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Two plant groups use the same species, soil and light. Group A receives 20 mL water and B receives 40 mL each day.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><text x="70" y="75">Same species • Same soil • Same light</text><rect x="80" y="130" width="190" height="170" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="370" y="130" width="190" height="170" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="135" y="185">Group A</text><text x="110" y="245">Water: 20 mL</text><text x="425" y="185">Group B</text><text x="400" y="245">Water: 40 mL</text></g></svg>