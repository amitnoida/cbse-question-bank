<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Growth record. Stage 1: seed germinates; Stage 2: young sapling develops; Stage 3: tree produces new branches</title><rect width="640" height="400" fill="white"/><g font-family="Noto Sans Devanagari,Arial,sans-serif" font-size="20" fill="#172554"><text x="45" y="45" font-size="24">Growth record</text><rect x="40" y="75" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="100">Stage 1: seed germinates</text><rect x="40" y="151" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="176">Stage 2: young sapling develops</text><rect x="40" y="227" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="252">Stage 3: tree produces new branches</text></g></svg>