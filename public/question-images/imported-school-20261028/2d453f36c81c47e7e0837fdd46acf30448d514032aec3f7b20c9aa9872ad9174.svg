<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A dot plot has two dots above category A, five above B and three above C. Each dot is one observation.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><line x1="100" y1="330" x2="550" y2="330" stroke="#1e40af" stroke-width="3"/><circle cx="210" cy="300" r="10" fill="#2563eb"/><circle cx="210" cy="265" r="10" fill="#2563eb"/><circle cx="330" cy="300" r="10" fill="#2563eb"/><circle cx="330" cy="265" r="10" fill="#2563eb"/><circle cx="330" cy="230" r="10" fill="#2563eb"/><circle cx="330" cy="195" r="10" fill="#2563eb"/><circle cx="330" cy="160" r="10" fill="#2563eb"/><circle cx="450" cy="300" r="10" fill="#2563eb"/><circle cx="450" cy="265" r="10" fill="#2563eb"/><circle cx="450" cy="230" r="10" fill="#2563eb"/><text x="200" y="370">A</text><text x="320" y="370">B</text><text x="440" y="370">C</text><text x="170" y="40">Each dot = one observation</text></g></svg>