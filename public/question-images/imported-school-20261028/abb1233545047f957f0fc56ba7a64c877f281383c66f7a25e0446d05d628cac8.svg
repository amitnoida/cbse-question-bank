<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A block slides to the right on a rough horizontal surface. An arrow P points left and Q points right.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><rect x="250" y="160" width="140" height="90" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/><line x1="70" y1="250" x2="570" y2="250" stroke="#1e40af" stroke-width="3"/><text x="215" y="90">Sliding motion →</text><line x1="250" y1="195" x2="130" y2="195" stroke="#1e40af" stroke-width="3"/><text x="120" y="180">← P</text><line x1="390" y1="195" x2="510" y2="195" stroke="#1e40af" stroke-width="3"/><text x="505" y="180">Q →</text></g></svg>