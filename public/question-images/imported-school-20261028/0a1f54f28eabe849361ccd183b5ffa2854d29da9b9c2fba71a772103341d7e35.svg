<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A place-value table has headings 16, 4 and 1, with digits 2, 3 and 1 below them.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><rect x="100" y="100" width="440" height="180" fill="none" stroke="#1e40af" stroke-width="2"/><line x1="100" y1="180" x2="540" y2="180" stroke="#1e40af" stroke-width="3"/><line x1="245" y1="100" x2="245" y2="280" stroke="#1e40af" stroke-width="3"/><line x1="390" y1="100" x2="390" y2="280" stroke="#1e40af" stroke-width="3"/><text x="140" y="150">16</text><text x="290" y="150">4</text><text x="440" y="150">1</text><text x="150" y="240">2</text><text x="295" y="240">3</text><text x="445" y="240">1</text><text x="130" y="60">Place values and digits</text></g></svg>