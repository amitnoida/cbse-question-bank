<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>The same job takes three equal-rate workers eight hours; six equal-rate workers are shown for comparison.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><text x="90" y="70">Same job, equal work rates</text><rect x="90" y="120" width="180" height="140" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="370" y="120" width="180" height="140" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="115" y="165">3 workers</text><text x="115" y="220">8 hours</text><text x="395" y="165">6 workers</text><text x="395" y="220">? hours</text></g></svg>