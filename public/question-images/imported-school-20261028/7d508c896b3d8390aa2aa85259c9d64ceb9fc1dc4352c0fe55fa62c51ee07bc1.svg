<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A three-level number pyramid has bottom row 4, x, 6, and top 24. Each block equals the sum of the two directly below.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><rect x="90" y="270" width="130" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="255" y="270" width="130" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="420" y="270" width="130" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="170" y="170" width="150" height="70" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/><rect x="345" y="170" width="150" height="70" fill="#bfdbfe" stroke="#1e40af" stroke-width="2"/><rect x="255" y="70" width="150" height="70" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/><text x="145" y="315">4</text><text x="310" y="315">x</text><text x="475" y="315">6</text><text x="240" y="215">?</text><text x="410" y="215">?</text><text x="315" y="115">24</text></g></svg>