<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Illustrative population data. Region A: 1,000 people in 10 km²; Region B: 1,000 people in 5 km²; Density = population ÷ area</title><rect width="640" height="400" fill="white"/><g font-family="Noto Sans Devanagari,Arial,sans-serif" font-size="20" fill="#172554"><text x="45" y="45" font-size="24">Illustrative population data</text><rect x="40" y="75" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="100">Region A: 1,000 people in 10 km²</text><rect x="40" y="151" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="176">Region B: 1,000 people in 5 km²</text><rect x="40" y="227" width="560" height="62" rx="6" fill="#dbeafe" stroke="#1e40af"/><text x="55" y="252">Density = population ÷ area</text></g></svg>