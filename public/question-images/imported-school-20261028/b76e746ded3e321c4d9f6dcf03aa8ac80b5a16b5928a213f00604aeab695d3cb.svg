<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Parallelogram ABCD has diagonals intersecting at O; AO is 4 cm and OC is x cm.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><polygon points="160,100 510,100 450,310 100,310" fill="none" stroke="#1e40af" stroke-width="3"/><line x1="160" y1="100" x2="450" y2="310" stroke="#1e40af" stroke-width="3"/><line x1="510" y1="100" x2="100" y2="310" stroke="#1e40af" stroke-width="3"/><text x="140" y="80">A</text><text x="515" y="90">B</text><text x="460" y="340">C</text><text x="70" y="335">D</text><text x="305" y="200">O</text><text x="235" y="55">AO=4 cm</text><text x="235" y="380">OC=x cm</text></g></svg>