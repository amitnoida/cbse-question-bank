<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Touching circles represent bonded atoms. A contains only identical red-blue pairs; B contains red-red and blue-blue pairs. Colours represent different elements.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><rect x="60" y="80" width="220" height="230" fill="none" stroke="#1e40af" stroke-width="2"/><rect x="360" y="80" width="220" height="230" fill="none" stroke="#1e40af" stroke-width="2"/><text x="150" y="55">A</text><text x="450" y="55">B</text><circle cx="140" cy="120" r="10" fill="#ef4444"/><circle cx="160" cy="120" r="10" fill="#2563eb"/><circle cx="430" cy="120" r="10" fill="#ef4444"/><circle cx="450" cy="120" r="10" fill="#ef4444"/><circle cx="140" cy="155" r="10" fill="#ef4444"/><circle cx="160" cy="155" r="10" fill="#2563eb"/><circle cx="430" cy="155" r="10" fill="#ef4444"/><circle cx="450" cy="155" r="10" fill="#ef4444"/><circle cx="140" cy="190" r="10" fill="#ef4444"/><circle cx="160" cy="190" r="10" fill="#2563eb"/><circle cx="430" cy="190" r="10" fill="#ef4444"/><circle cx="450" cy="190" r="10" fill="#ef4444"/><circle cx="140" cy="225" r="10" fill="#ef4444"/><circle cx="160" cy="225" r="10" fill="#2563eb"/><circle cx="430" cy="225" r="10" fill="#2563eb"/><circle cx="450" cy="225" r="10" fill="#2563eb"/><circle cx="140" cy="260" r="10" fill="#ef4444"/><circle cx="160" cy="260" r="10" fill="#2563eb"/><circle cx="430" cy="260" r="10" fill="#2563eb"/><circle cx="450" cy="260" r="10" fill="#2563eb"/></g></svg>