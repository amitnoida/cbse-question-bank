<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Six equal squares form a cube net: four in a vertical strip, with one square attached to each side of the second square.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="21" fill="#172554"><rect x="280" y="100" width="50" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="230" y="150" width="50" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="280" y="150" width="50" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="330" y="150" width="50" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="280" y="200" width="50" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><rect x="280" y="250" width="50" height="50" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="150" y="360">Six equal squares form a net</text></g></svg>