<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>A cycle diagram shows ocean water, water vapour, clouds and rain over land, with arrows in that sequence.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><text x="70" y="95">Ocean water</text><text x="380" y="95">Water vapour</text><text x="400" y="280">Clouds</text><text x="80" y="280">Rain on land</text><line x1="220" y1="90" x2="370" y2="90" stroke="#1e40af" stroke-width="3"/><text x="350" y="100">→</text><line x1="470" y1="115" x2="470" y2="245" stroke="#1e40af" stroke-width="3"/><text x="455" y="240">↓</text><line x1="380" y1="275" x2="230" y2="275" stroke="#1e40af" stroke-width="3"/><text x="235" y="285">←</text></g></svg>