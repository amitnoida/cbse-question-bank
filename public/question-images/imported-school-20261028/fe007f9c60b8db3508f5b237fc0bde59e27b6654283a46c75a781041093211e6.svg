<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"><title>Arrows run from food to eater: grass to rabbit, grass to grasshopper, rabbit to hawk, grasshopper to frog and frog to hawk.</title><rect width="640" height="400" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#172554"><text x="40" y="210">Grass</text><text x="240" y="110">Rabbit</text><text x="210" y="310">Grasshopper</text><text x="405" y="310">Frog</text><text x="510" y="110">Hawk</text><line x1="110" y1="195" x2="230" y2="110" stroke="#1e40af" stroke-width="3"/><text x="220" y="120">→</text><line x1="110" y1="215" x2="210" y2="295" stroke="#1e40af" stroke-width="3"/><text x="200" y="295">→</text><line x1="310" y1="105" x2="500" y2="105" stroke="#1e40af" stroke-width="3"/><text x="485" y="112">→</text><line x1="345" y1="305" x2="400" y2="305" stroke="#1e40af" stroke-width="3"/><text x="385" y="312">→</text><line x1="455" y1="285" x2="535" y2="130" stroke="#1e40af" stroke-width="3"/><text x="525" y="145">↑</text></g></svg>