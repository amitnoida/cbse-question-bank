name: ExamYari Production Auth Read-Only E2E

on:
  push:
    branches: [release/examyari-admin-improvements-oct30]
    paths:
      - 'e2e/production-auth-readonly.spec.cjs'
      - '.github/workflows/examyari-production-auth-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BASE_URL: https://examyari.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate dedicated QA accounts
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: |
          test -n "$E2E_ACCOUNTS_JSON" || { echo 'Dedicated QA credentials unavailable'; exit 1; }
          node e2e/validate-accounts.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Test production user read access without writes
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/production-auth-readonly.spec.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examyari-production-auth-readonly-results
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
