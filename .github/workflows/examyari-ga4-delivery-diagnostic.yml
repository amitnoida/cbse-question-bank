name: Diagnose GA4 live network delivery
on:
  push:
    branches: [diagnostics/examyari-ga4-delivery-20261030]
    paths:
      - 'e2e/ga4-delivery-diagnostic.spec.cjs'
      - '.github/workflows/examyari-ga4-delivery-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ga4-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Check live Google Analytics network delivery
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/ga4-delivery-diagnostic.spec.cjs
