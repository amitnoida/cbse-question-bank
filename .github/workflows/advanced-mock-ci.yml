name: Advanced Mock TypeScript and Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/advanced-mock/**'
      - 'app/app/page.tsx'
      - 'stage2-advanced-mock/**'
      - '.github/workflows/advanced-mock-ci.yml'
  push:
    branches: [stage2-advanced-mock-20261028]
    paths:
      - 'app/advanced-mock/**'
      - 'app/app/page.tsx'
      - 'stage2-advanced-mock/**'
      - '.github/workflows/advanced-mock-ci.yml'

permissions:
  contents: read

jobs:
  typescript-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-public-key-no-real-credentials'
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9a3 # v4.2.2
        with:
          persist-credentials: false

      - name: Node version
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
