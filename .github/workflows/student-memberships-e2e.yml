name: Student Membership Lifecycle Checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/student-memberships-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: student-membership-lifecycle
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Focused API checks
        run: node --test maintenance/test-admin-subscription-catalog.cjs
      - name: Wait for student membership release
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<60;i++){
            try{const r=await fetch('https://cbse-question-bank.vercel.app/memberships');if(r.ok&&(await r.text()).includes('Plans and classes')){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw Error('Student membership release was not ready');
          JS
      - name: Install browser tools
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1 && npx playwright install --with-deps chromium
      - name: Production student and admin checks without purchases
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
          E2E_BASE_URL: https://cbse-question-bank.vercel.app
        run: npx playwright test --config=e2e/student-memberships.config.cjs
