name: ExamYari GA4 Consent and Privacy E2E

on:
  push:
    branches: [release/examyari-admin-improvements-oct30]
    paths:
      - 'app/layout.tsx'
      - 'app/public-analytics-consent.tsx'
      - 'app/analytics-preferences-button.tsx'
      - 'app/public-navigation.tsx'
      - 'e2e/public-analytics.spec.cjs'
      - '.github/workflows/examyari-ga4-privacy-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BASE_URL: https://cbse-question-bank-git-release-examya-35f33e-cbse-question-bank.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Verify protected preview access secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
      - name: Run anonymous GA4 privacy browser tests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/public-analytics.spec.cjs
      - name: Upload failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examyari-ga4-privacy-test-evidence
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
