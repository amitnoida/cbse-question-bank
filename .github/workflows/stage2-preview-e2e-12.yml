name: Stage 2 Preview 12-Account E2E

# GitHub requires a workflow file on the default branch to show "Run workflow".
# This is a manual test launcher; Stage 2 app remains isolated on its branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbse-stage2-preview-12-manual
  cancel-in-progress: false

jobs:
  preview-access:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank-f74nc65x6-cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout Stage 2 test branch (never merge app code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: stage2-advanced-mock-20261028
          persist-credentials: false
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify test prerequisites without printing secrets
        run: |
          if [ -z "$E2E_ACCOUNTS_JSON" ]; then
            echo "::error::Missing E2E_ACCOUNTS_JSON secret"; exit 1;
          fi
          if [ -z "$E2E_VERCEL_BYPASS" ]; then
            echo "::error::Missing VERCEL_AUTOMATION_BYPASS_SECRET for protected Vercel preview"; exit 1;
          fi
      - name: Run 12-account preview E2E
        run: npx playwright test --config=e2e/advanced-mock-12.config.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-mock-12-preview-manual-results
          path: |
            e2e/results/advanced-12.json
            e2e/results/advanced-12-artifacts/
            e2e/report-advanced-12/
          retention-days: 7
          if-no-files-found: ignore
