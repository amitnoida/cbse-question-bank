name: Stage 2 Preview 12-Account E2E
on:
  push:
    branches: [stage2-advanced-mock-20261028]
    paths: ['e2e/advanced-mock-12.*', '.github/workflows/stage2-preview-e2e-12.yml']
  pull_request:
    branches: [main]
    paths: ['e2e/advanced-mock-12.*', '.github/workflows/stage2-preview-e2e-12.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cbse-stage2-12-preview
  cancel-in-progress: false
jobs:
  preview-access:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank-f74nc65x6-cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      E2E_VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify test prerequisites without showing secrets
        run: |
          if [ -z "$E2E_ACCOUNTS_JSON" ]; then
            echo "::error::GitHub Actions E2E_ACCOUNTS_JSON secret is missing"; exit 1;
          fi
          if [ -z "$E2E_VERCEL_BYPASS" ]; then
            echo "::error::Preview is protected by Vercel Authentication. Configure the GitHub Actions VERCEL_AUTOMATION_BYPASS_SECRET secret; never print it or disable protection."; exit 1;
          fi
      - name: Run 12 school/admin account sign-in and Advanced Mock gate checks
        run: npx playwright test --config=e2e/advanced-mock-12.config.cjs
      - name: Upload test results and screenshots (7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-mock-12-preview-e2e-evidence
          path: |
            e2e/results/advanced-12.json
            e2e/results/advanced-12-artifacts/
            e2e/report-advanced-12/
          retention-days: 7
          if-no-files-found: ignore
