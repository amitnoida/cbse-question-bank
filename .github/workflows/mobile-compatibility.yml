name: ExamShuru Android and iPhone Browser Compatibility
on:
  workflow_dispatch:
  deployment_status:
  push:
    branches: [main]
    paths:
      - 'e2e/mobile-compatibility*'
      - '.github/workflows/mobile-compatibility.yml'
permissions:
  contents: read
concurrency:
  group: mobile-compatibility
  cancel-in-progress: true
jobs:
  mobile:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://examshuru.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=e2e/mobile-compatibility.config.cjs
      - name: Save mobile reports and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-compatibility-results
          path: results/mobile-*
          retention-days: 7
