name: ExamYari Draft Preview - Membership and Admin E2E

on:
  push:
    branches: [release/examyari-admin-improvements-oct30]
    paths:
      - '.github/workflows/examyari-preview-e2e.yml'
      - 'e2e/admin-reports.spec.cjs'
      - 'e2e/student-memberships.spec.cjs'
      - 'e2e/preview-protection.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examyari-draft-preview-e2e
  cancel-in-progress: false

jobs:
  preview-e2e:
    name: Protected preview browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      E2E_BASE_URL: https://cbse-question-bank-jwiaj0e9z-cbse-question-bank.vercel.app
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify test credentials without printing them
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$E2E_ACCOUNTS_JSON" || { echo "BLOCKED: E2E_ACCOUNTS_JSON is not configured"; exit 1; }
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo "BLOCKED: VERCEL_AUTOMATION_BYPASS_SECRET is not configured"; exit 1; }
          node e2e/validate-accounts.cjs

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright for testing
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run preview E2E using dedicated test accounts
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/student-memberships.spec.cjs e2e/admin-reports.spec.cjs

      - name: Summarize actual passing and failing browser cases
        if: always()
        run: node e2e/summarize-results.cjs
