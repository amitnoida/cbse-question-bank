name: ExamYari Admin and Membership Production Regression
on:
  push:
    branches: [main]
    paths:
      - 'app/admin/reports/page.tsx'
      - 'app/admin/subscriptions/coupon-scope-editor.tsx'
      - 'app/memberships/page.tsx'
      - 'e2e/admin-reports.spec.cjs'
      - 'e2e/student-memberships.spec.cjs'
      - '.github/workflows/examyari-admin-membership-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      E2E_BASE_URL: https://examyari.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Validate dedicated QA accounts
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: |
          test -n "$E2E_ACCOUNTS_JSON" || { echo 'Dedicated QA accounts missing'; exit 1; }
          node e2e/validate-accounts.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Run authenticated read-only admin and membership tests
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/admin-reports.spec.cjs e2e/student-memberships.spec.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examyari-admin-membership-regression
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
