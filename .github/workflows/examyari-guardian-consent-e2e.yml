name: ExamYari Guardian Consent Read-only Browser Checks
on:
  push:
    branches: [main]
    paths:
      - 'app/admin/guardian-consent/**'
      - 'app/api/admin/guardian-consent/**'
      - 'app/app/page.tsx'
      - 'app/api/admin/students/**'
      - 'e2e/guardian-consent.spec.cjs'
      - '.github/workflows/examyari-guardian-consent-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BASE_URL: https://examyari.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=e2e/playwright.config.cjs e2e/guardian-consent.spec.cjs
