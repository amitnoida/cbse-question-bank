name: CBSE Media Audit Targeted E2E

# Runs only the previously failing admin-media regression, not the mutation-heavy full student suite.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-audit-targeted-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbse-media-audit-targeted
  cancel-in-progress: false

jobs:
  media-audit:
    name: Verify Full Admin Media Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      E2E_BASE_URL: 'https://examshuru.com'
    steps:
      - name: Checkout production tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install packages
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate 12 stored accounts
        run: node e2e/validate-accounts.cjs
      - name: Recheck only Full Admin Image and Media Audit
        run: >-
          npx playwright test --config=e2e/playwright.config.cjs admin-reports.spec.cjs
          --grep 'Full Admin: Image & Media Audit'
      - name: Upload failure screenshots and JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-audit-targeted-e2e
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
