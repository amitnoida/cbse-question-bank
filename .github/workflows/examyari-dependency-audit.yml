name: ExamYari Dependency Security Audit
on:
  schedule:
    - cron: '16 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/examyari-dependency-audit.yml'
      - 'next.config.ts'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/examyari-dependency-audit.yml'
permissions:
  contents: read
jobs:
  audit-production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high
