name: CBSE School E2E - 12 Accounts

# One-click regression verifies chapter selection, free sets and simplified mock submission.
# Manual runs, or an explicitly marked release commit, use dedicated test accounts only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-e2e.yml']

permissions:
  contents: read
  statuses: read

concurrency:
  group: cbse-full-e2e-production
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-school-e2e]')
    name: Full UI, SEO, auth, student and admin regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      E2E_BASE_URL: https://cbse-question-bank.vercel.app
      CI: 'true'
    steps:
      - name: Get latest test code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright without changing application lockfile
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate 12 school and administrator test accounts
        run: node e2e/validate-accounts.cjs

      - name: Wait for this commit to reach production
        run: node e2e/wait-for-production.cjs
        env:
          GH_STATUS_TOKEN: ${{ github.token }}

      - name: Execute all Playwright E2E tests
        id: playwright
        run: npx playwright test --config=e2e/playwright.config.cjs

      - name: Show test summary and exact failed cases
        if: always()
        run: node e2e/summarize-results.cjs

      - name: Upload HTML report, screenshots and JSON test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbse-school-e2e-12-accounts
          path: |
            e2e/results/
            e2e/report/
          retention-days: 14
          if-no-files-found: ignore
