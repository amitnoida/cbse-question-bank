name: CBSE Cloud E2E (test accounts)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *' # 23:00 IST
permissions:
  contents: read
concurrency:
  group: cbse-cloud-e2e
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      E2E_BASE_URL: https://cbse-question-bank.vercel.app
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install test runner (without modifying project lockfile)
        run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Validate configured accounts
        run: node -e 'const a=JSON.parse(process.env.E2E_ACCOUNTS_JSON||"[]"); if(!Array.isArray(a)||!a.length) throw Error("Configure E2E_ACCOUNTS_JSON secret first"); console.log("Configured test accounts:",a.length)'
      - name: Run sequential login and access smoke tests
        run: npx playwright test --config=e2e/playwright.config.cjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbse-e2e-results
          path: |
            e2e/results/
            e2e/report/
          retention-days: 14
          if-no-files-found: ignore
