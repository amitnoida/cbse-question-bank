name: FINAL CBSE Advanced Mock Consolidated Production E2E
on:
  push:
    branches: [advanced-mock-academic-review-20261028]
    paths:
      - '.github/workflows/final-advanced-mock-production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: final-advanced-mock-production-one-time
  cancel-in-progress: false

jobs:
  final-production:
    name: One consolidated production browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
    steps:
      - name: Checkout review branch for tests, production target remains fixed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install project deps and scoped Playwright runner
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate all 12 designated school and admin test accounts
        run: node e2e/validate-accounts.cjs
      - name: Single final run — 12 logins, five underfilled guards, three full 60-question paid/free Advanced Mocks
        run: >-
          npx playwright test --config=e2e/playwright.config.cjs
          login.spec.cjs
          final-advanced-mock-production-readiness.spec.cjs
          class11-physics-live-advanced.spec.cjs
          class12-chemistry-live-advanced.spec.cjs
          class12-biology-live-advanced.spec.cjs
      - name: Upload final result and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-cbse-advanced-mock-production-regression
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
