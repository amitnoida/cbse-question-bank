name: CBSE Final Four-Agent Production E2E
on:
  push:
    branches: [advanced-mock-final-consolidated-e2e-20261028]
    paths:
      - '.github/workflows/final-four-agent-production-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cbse-final-four-agent-production-e2e
  cancel-in-progress: false

jobs:
  advanced-mock:
    name: Advanced Mock readiness, free gates and 3 complete paid papers
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      FINAL_TEST_SCOPE: 'Advanced Mock — all four agents'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Playwright
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false @playwright/test && npx playwright install --with-deps chromium
      - name: Validate all 12 test accounts
        run: node e2e/validate-accounts.cjs
      - name: Run single consolidated Advanced Mock production regression
        run: npx playwright test --config=e2e/playwright.config.cjs final-four-agent-advanced.spec.cjs
      - name: Summarize results even on failure
        if: always()
        run: node e2e/final-four-agent-summary.cjs
      - name: Archive Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-advanced-mock-e2e
          path: |
            e2e/report/
            e2e/results/
          retention-days: 7
          if-no-files-found: ignore

  school-students:
    name: 12-user login, standard mock, practice and student journeys
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      FINAL_TEST_SCOPE: 'School login, practice and Standard Mock'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Playwright
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false @playwright/test && npx playwright install --with-deps chromium
      - name: Validate all 12 test accounts
        run: node e2e/validate-accounts.cjs
      - name: Run school students and Standard Mock regression
        run: npx playwright test --config=e2e/playwright.config.cjs login.spec.cjs full-journeys.spec.cjs multi-class-free-practice.spec.cjs multi-class-mock.spec.cjs
      - name: Summarize results even on failure
        if: always()
        run: node e2e/final-four-agent-summary.cjs
      - name: Archive Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-school-student-e2e
          path: |
            e2e/report/
            e2e/results/
          retention-days: 7
          if-no-files-found: ignore

  admin-and-public:
    name: Admin viewer/full access, reports, public routes and read-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
      FINAL_TEST_SCOPE: 'Admin access, public website and SEO'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Playwright
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false @playwright/test && npx playwright install --with-deps chromium
      - name: Validate all 12 test accounts
        run: node e2e/validate-accounts.cjs
      - name: Run admin and public route regressions
        run: npx playwright test --config=e2e/playwright.config.cjs admin-reports.spec.cjs public-class-seo.spec.cjs single-homepage-portal.spec.cjs access-readonly.spec.cjs
      - name: Summarize results even on failure
        if: always()
        run: node e2e/final-four-agent-summary.cjs
      - name: Archive Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-admin-and-public-e2e
          path: |
            e2e/report/
            e2e/results/
          retention-days: 7
          if-no-files-found: ignore
