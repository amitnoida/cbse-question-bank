name: ExamShuru Final Admin Features Read-Only Regression
on:
  push:
    branches: [main]
    paths:
      - 'app/admin/accounts/**'
      - 'app/admin/usage/**'
      - 'app/api/admin/accounts/**'
      - 'app/api/admin/usage/**'
      - 'app/admin/teacher-imports/**'
      - 'e2e/admin-final-three.spec.cjs'
      - '.github/workflows/examyari-admin-final-three.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BASE_URL: https://examshuru.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Check QA accounts
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: |
          test -n "$E2E_ACCOUNTS_JSON"
          node e2e/validate-accounts.cjs
      - run: npm ci --no-audit --no-fund
      - name: Test MCQ extraction and safe skipping
        run: node --test maintenance/test-mcq-document-parser.cjs
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Verify production protected admin paths (no writes)
        env:
          E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/admin-final-three.spec.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examyari-final-admin-tests
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
