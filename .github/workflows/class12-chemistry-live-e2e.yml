name: Class 12 Chemistry Advanced Mock Live E2E
on:
  push:
    branches: [advanced-mock-academic-review-20261028]
    paths:
      - '.github/workflows/class12-chemistry-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: class12-chemistry-live-e2e
  cancel-in-progress: false

jobs:
  chemistry-live:
    name: Free gate and paid full Advanced Mock regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: 'true'
      E2E_BASE_URL: 'https://cbse-question-bank.vercel.app'
      E2E_ACCOUNTS_JSON: ${{ secrets.E2E_ACCOUNTS_JSON }}
    steps:
      - name: Checkout current review branch with exact code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund && npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate stored test accounts
        run: node e2e/validate-accounts.cjs
      - name: Test Class 12 Chemistry full Advanced Mock flow
        run: npx playwright test --config=e2e/playwright.config.cjs class12-chemistry-live-advanced.spec.cjs
      - name: Upload targeted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class12-chemistry-advanced-live-e2e
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
