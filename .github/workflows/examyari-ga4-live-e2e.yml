name: ExamYari Live GA4 Consent E2E

on:
  push:
    branches: [release/examyari-admin-improvements-oct30]
    paths:
      - '.github/workflows/examyari-ga4-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ga4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_BASE_URL: https://examyari.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Test live GA4 consent and private-route exclusions
        run: npx playwright test --config=e2e/playwright.config.cjs e2e/public-analytics.spec.cjs
      - name: Upload privacy test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examyari-ga4-live-e2e-results
          path: |
            e2e/results/
            e2e/report/
          retention-days: 7
          if-no-files-found: ignore
